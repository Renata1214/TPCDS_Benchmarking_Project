services:
  tpcds:
    build:
      context: .
      args:
        DUCKDB_VERSION: "${DUCKDB_VERSION:-1.4.3}"
    working_dir: /workspace
    volumes:
      - .:/workspace
    environment:
      REFERENCE_SCALE_GB: "${REFERENCE_SCALE_GB:-10}"
      REPEATS: "${REPEATS:-1}"
      TIMEOUT_SECONDS: "${TIMEOUT_SECONDS:-300}"
